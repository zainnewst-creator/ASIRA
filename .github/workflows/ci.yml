name: ASIRA CI Quality & Security Pipeline

on:
  push:
    branches: [ master, main, phase-3-production-readiness ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  validate:
    name: TypeCheck, Security Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Validation
        run: npx tsc --noEmit

      - name: Run Automated Security Test Suite
        run: npm test

      - name: Build Production Assets
        run: npm run build
